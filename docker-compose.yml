services:
  broker:
    image: confluentinc/cp-kafka:7.5.0
    container_name: broker
    hostname: broker
    ports:
      - "9092:9092"
    environment:
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk

      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@broker:29093

      KAFKA_LISTENERS: >-
        INTERNAL://0.0.0.0:29092,
        EXTERNAL://0.0.0.0:9092,
        CONTROLLER://0.0.0.0:29093
      KAFKA_ADVERTISED_LISTENERS: >-
        INTERNAL://broker:29092,
        EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: >-
        INTERNAL:PLAINTEXT,
        EXTERNAL:PLAINTEXT,
        CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 2
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test:
        - CMD-SHELL
        - kafka-topics --bootstrap-server broker:29092 --list >/dev/null 2>&1
      interval: 10s
      timeout: 5s
      retries: 10

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    depends_on:
      broker:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: broker:29092

  jobmanager:
    image: flink:1.18-java11
    container_name: jobmanager
    hostname: jobmanager
    ports:
      - "8081:8081"
    command: jobmanager
    environment:
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: jobmanager
        parallelism.default: 2
        state.backend.type: rocksdb
        state.checkpoints.dir: file:///opt/flink/checkpoints
        execution.checkpointing.interval: 10s
    depends_on:
      flink-checkpoints-init:
        condition: service_completed_successfully
    volumes:
      - flink_checkpoints:/opt/flink/checkpoints

  taskmanager:
    image: flink:1.18-java11
    container_name: taskmanager
    depends_on:
      - jobmanager
      - broker
    command: taskmanager
    cpus: 2.0
    mem_limit: 2g
    environment:
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: jobmanager
        taskmanager.numberOfTaskSlots: 2
        parallelism.default: 2
        taskmanager.memory.process.size: 2048m
        taskmanager.memory.managed.fraction: 0.4
        state.backend.type: rocksdb
        state.backend.rocksdb.memory.managed: true
        state.checkpoints.dir: file:///opt/flink/checkpoints
        execution.checkpointing.interval: 10s
    volumes:
      - flink_checkpoints:/opt/flink/checkpoints

  dynamodb-local:
    image: amazon/dynamodb-local:latest
    container_name: dynamodb-local
    command: "-jar DynamoDBLocal.jar -sharedDb -dbPath /home/dynamodblocal/data"
    working_dir: /home/dynamodblocal
    ports:
      - "8000:8000"
    volumes:
      - dynamodb_data:/home/dynamodblocal/data

  kafka-init:
    image: confluentinc/cp-kafka:7.5.0
    depends_on:
      broker:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -c
      - |
        kafka-topics \
          --bootstrap-server broker:29092 \
          --create \
          --if-not-exists \
          --topic alpaca.marketdata \
          --partitions 2 \
          --replication-factor 1
  
  flink-checkpoints-init:
    image: busybox:1.36
    container_name: flink-checkpoints-init
    user: root
    command:
      - sh
      - -c
      - chown -R 9999:9999 /opt/flink/checkpoints
    volumes:
      - flink_checkpoints:/opt/flink/checkpoints

volumes:
  kafka_data:
  flink_checkpoints:
  dynamodb_data: